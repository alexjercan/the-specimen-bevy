[package]
name = "the-specimen-bevy"
description = "The Specimen, a facility horror game built with Bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autoexamples = false

[lints]
workspace = true

[lib]
name = "game"

[workspace]
members = [
    "crates/achievements",
    "crates/assets",
    "crates/audio",
    "crates/autopilot",
    "crates/capture",
    "crates/app",
    "crates/frontend",
    "crates/debug",
    "crates/flow",
    "crates/gameplay",
    "crates/halloween",
    "crates/settings",
    "crates/stdio",
    "crates/ui",
]
resolver = "2"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bevy = { version = "=0.20.0", features = ["jpeg", "wav"] }
bevy_asset_loader = "0.28.1"
bevy_enhanced_input = "0.27.2"
bevy_rand = { version = "0.16.0", features = ["chacha20"] }
rand_core = "0.10.0"
clap = { version = "4.5.49", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_egui = { version = "0.43.1", default-features = false, features = ["bevy_ui", "default_fonts", "render"] }
bevy-inspector-egui = { version = "0.38.0", default-features = false, features = ["bevy"] }
autopilot = { path = "crates/autopilot" }
capture = { path = "crates/capture" }
game_achievements = { path = "crates/achievements" }
game_app = { path = "crates/app" }
game_flow = { path = "crates/flow" }
game_frontend = { path = "crates/frontend" }
game_assets = { path = "crates/assets" }
game_audio = { path = "crates/audio" }
game_settings = { path = "crates/settings" }
game_halloween = { path = "crates/halloween" }
gameplay = { path = "crates/gameplay" }
debug = { path = "crates/debug" }
stdio = { path = "crates/stdio" }
game_ui = { path = "crates/ui" }

[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
debug = 0

[features]
debug = ["game_app/debug"]
steam = ["game_app/steam"]
halloween = ["game_app/halloween", "dep:game_halloween"]
tracy = ["bevy/trace_tracy"]
trace-chrome = ["bevy/trace_chrome"]

[dependencies]
bevy.workspace = true
clap.workspace = true
game_app.workspace = true
game_flow.workspace = true
game_frontend.workspace = true
game_settings.workspace = true
game_assets.workspace = true
game_halloween = { workspace = true, optional = true }
gameplay.workspace = true
autopilot.workspace = true
capture.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false


[[example]]
name = "facility_shots"
path = "examples/facility_shots.rs"

[[example]]
name = "halloween_gallery"
path = "examples/halloween_gallery.rs"
required-features = ["halloween"]

[[example]]
name = "human_deer_viewer"
path = "examples/human_deer_viewer.rs"

[[example]]
name = "prop_gallery"
path = "examples/prop_gallery.rs"

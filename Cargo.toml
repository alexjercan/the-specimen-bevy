[package]
name = "horror_game_bevy"
description = "Extremely shitty horror game made with bevy and slop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autoexamples = false

[workspace]
members = ["crates/autopilot", "crates/capture"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bevy = { version = "0.19.1", features = ["jpeg"] }
clap = { version = "4.5.49", features = ["derive"] }
autopilot = { path = "crates/autopilot" }
capture = { path = "crates/capture" }

[dependencies]
bevy.workspace = true
clap.workspace = true

[dev-dependencies]
autopilot.workspace = true
capture.workspace = true

[[example]]
name = "facility_gallery"
path = "examples/facility_gallery.rs"

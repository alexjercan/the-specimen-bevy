[package]
name = "the-specimen-bevy"
description = "The Specimen, a facility horror game built with Bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autoexamples = false

[lib]
name = "game"

[workspace]
members = [
    "crates/assets",
    "crates/audio",
    "crates/autopilot",
    "crates/capture",
    "crates/core",
    "crates/debug",
    "crates/gameplay",
    "crates/probe",
    "crates/settings",
    "crates/transport",
    "crates/ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bevy = { version = "0.19.1", features = ["jpeg", "wav"] }
bevy_asset_loader = "0.27.0"
bevy_enhanced_input = "0.26.0"
bevy_rand = { version = "0.15.0", features = ["chacha20"] }
rand_core = "0.10.0"
clap = { version = "4.5.49", features = ["derive"] }
bevy_egui = { version = "0.40.1", default-features = false, features = ["bevy_ui", "default_fonts", "render"] }
bevy-inspector-egui = { version = "0.37.0", default-features = false, features = ["bevy"] }
autopilot = { path = "crates/autopilot" }
capture = { path = "crates/capture" }
game_core = { path = "crates/core" }
game_assets = { path = "crates/assets" }
game_audio = { path = "crates/audio" }
game_settings = { path = "crates/settings" }
gameplay = { path = "crates/gameplay" }
debug = { path = "crates/debug" }
probe = { path = "crates/probe" }
transport = { path = "crates/transport" }
game_ui = { path = "crates/ui" }

[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
debug = 0

[features]
debug = ["game_core/debug"]

[dependencies]
bevy.workspace = true
clap.workspace = true
game_core.workspace = true
game_assets.workspace = true
gameplay.workspace = true
autopilot.workspace = true
capture.workspace = true
probe.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[[example]]
name = "facility_gallery"
path = "examples/facility_gallery.rs"

[[example]]
name = "facility_layout"
path = "examples/facility_layout.rs"

[[example]]
name = "facility_probe"
path = "examples/facility_probe.rs"

[[example]]
name = "facility_overhead_probe"
path = "examples/facility_overhead_probe.rs"

[[example]]
name = "human_deer_viewer"
path = "examples/human_deer_viewer.rs"

[package]
name = "game_frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
debug = ["dep:debug"]

[dependencies]
bevy.workspace = true
bevy_enhanced_input.workspace = true
game_achievements.workspace = true
game_audio.workspace = true
game_flow.workspace = true
game_settings.workspace = true
game_ui.workspace = true
gameplay.workspace = true
debug = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "EventTarget", "Window"] }

[dev-dependencies]
game_assets.workspace = true
bevy_asset_loader.workspace = true

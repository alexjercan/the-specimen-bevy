name: deploy-pages
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Web build variant
        required: true
        default: normal
        type: choice
        options:
          - normal
          - halloween
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build game for the web
        shell: bash
        run: |
          if [[ "${{ inputs.flavor }}" == halloween ]]; then
            nix develop --command trunk build --release --features halloween
          else
            nix develop --command trunk build --release
          fi
      - name: Prepare Pages site
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag for both flavors
        required: true
        type: string
      flavor:
        description: Release build variant
        required: true
        default: normal
        type: choice
        options:
          - normal
          - halloween
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_FLAVOR: ${{ inputs.flavor || 'normal' }}
  FLAVOR_SUFFIX: ${{ (inputs.flavor == 'halloween' && '-halloween') || '' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release tag and flavor
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must have the form vX.Y.Z" >&2; exit 1; }
          if [[ "$RELEASE_FLAVOR" == halloween ]]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "Publish the normal release before adding Halloween builds" >&2; exit 1; }
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
  linux:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev
      - name: Build release
        shell: bash
        run: |
          if [[ "$RELEASE_FLAVOR" == halloween ]]; then
            cargo build --locked --release -p the-specimen-bevy --features halloween
          else
            cargo build --locked --release -p the-specimen-bevy
          fi
      - name: Package game
        run: |
          mkdir -p package
          install -m 755 target/release/the-specimen-bevy package/the-specimen-bevy
          cp -r assets credits LICENSE package/
          tar -czf "the-specimen-bevy-${RELEASE_TAG}-linux-x86_64${FLAVOR_SUFFIX}.tar.gz" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: the-specimen-bevy-linux-x86_64${{ env.FLAVOR_SUFFIX }}
          path: the-specimen-bevy-*-linux-x86_64*.tar.gz
          if-no-files-found: error
  web:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: cachix/install-nix-action@v31
      - name: Build HTML5 game
        shell: bash
        run: |
          if [[ "$RELEASE_FLAVOR" == halloween ]]; then
            nix develop --command trunk build --release --features halloween
          else
            nix develop --command trunk build --release
          fi
      - name: Package HTML5 game
        run: |
          test -f dist/index.html
          test -d dist/assets
          find dist -maxdepth 1 -type f -name '*_bg.wasm' -print -quit | grep -q .
          (cd dist && zip -qr "../the-specimen-bevy-${RELEASE_TAG}-html5${FLAVOR_SUFFIX}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: the-specimen-bevy-html5${{ env.FLAVOR_SUFFIX }}
          path: the-specimen-bevy-*-html5*.zip
          if-no-files-found: error
  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build release
        shell: pwsh
        run: |
          if ($env:RELEASE_FLAVOR -eq 'halloween') {
            cargo build --locked --release -p the-specimen-bevy --features halloween
          } else {
            cargo build --locked --release -p the-specimen-bevy
          }
      - name: Package game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/release/the-specimen-bevy.exe package/
          Copy-Item -Recurse assets package/assets
          Copy-Item -Recurse credits package/credits
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "the-specimen-bevy-${env:RELEASE_TAG}-windows-x86_64${env:FLAVOR_SUFFIX}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: the-specimen-bevy-windows-x86_64${{ env.FLAVOR_SUFFIX }}
          path: the-specimen-bevy-*-windows-x86_64*.zip
          if-no-files-found: error
  publish:
    needs: [linux, web, windows]
    if: ${{ needs.linux.result == 'success' && needs.web.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download all builds for this tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          for platform in linux-x86_64 windows-x86_64 html5; do
            name="the-specimen-bevy-${platform}${FLAVOR_SUFFIX}"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "downloads/$name"
            case "$platform" in linux-x86_64) extension=tar.gz ;; *) extension=zip ;; esac
            test -f "downloads/$name/the-specimen-bevy-${RELEASE_TAG}-${platform}${FLAVOR_SUFFIX}.${extension}"
          done
      - name: Prepare release notes from tagged changelog
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['RELEASE_TAG'].removeprefix('v')
          heading = f'## [{version}]'
          notes = []
          recording = False
          for line in Path('CHANGELOG.md').read_text().splitlines():
              if line.startswith('## '):
                  if recording:
                      break
                  recording = line.startswith(heading + ' ')
              elif recording:
                  notes.append(line)
          content = '\n'.join(notes).strip()
          if not content:
              raise SystemExit(f'Missing release notes for {version} in CHANGELOG.md')
          Path('release-notes.md').write_text(content + '\n')
          PY
      - name: Publish flavor archives
        shell: bash
        run: |
          set -euo pipefail
          archives=()
          for platform in linux-x86_64 windows-x86_64 html5; do
            case "$platform" in linux-x86_64) extension=tar.gz ;; *) extension=zip ;; esac
            archives+=("downloads/the-specimen-bevy-${platform}${FLAVOR_SUFFIX}/the-specimen-bevy-${RELEASE_TAG}-${platform}${FLAVOR_SUFFIX}.${extension}")
          done
          if [[ "$RELEASE_FLAVOR" == halloween ]]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets.txt
            for archive in "${archives[@]}"; do
              if grep -Fxq "${archive##*/}" existing-assets.txt; then
                echo "Asset ${archive##*/} already exists; refusing to overwrite it" >&2
                exit 1
              fi
            done
            gh release upload "$RELEASE_TAG" "${archives[@]}" --repo "$GITHUB_REPOSITORY"
          else
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "GitHub Release $RELEASE_TAG already exists; refusing to overwrite it" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "${archives[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort > release-assets.txt
          for archive in "${archives[@]}"; do
            grep -Fxq "${archive##*/}" release-assets.txt
          done

name: Native release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build native package and export its Nix closure
        run: |
          nix build --print-build-logs --print-out-paths > store-path.txt
          nix-store -qR "$(readlink -f result)" |
            xargs nix-store --export | gzip -1 > the-specimen-bevy-linux.nar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: the-specimen-bevy-linux
          path: |
            the-specimen-bevy-linux.nar.gz
            store-path.txt
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build native release
        run: cargo build --locked --release -p the-specimen-bevy
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/release/the-specimen-bevy.exe package/
          Copy-Item -Recurse assets package/assets
          Copy-Item -Recurse credits package/credits
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath the-specimen-bevy-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: the-specimen-bevy-windows
          path: the-specimen-bevy-windows.zip
          if-no-files-found: error

name: deploy-itch
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
      flavors:
        description: Which builds to upload
        required: true
        default: normal
        type: choice
        options:
          - normal
          - halloween
          - both
permissions:
  contents: read
concurrency:
  group: itch-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: itch-production
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_FLAVORS: ${{ inputs.flavors }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      BUTLER_VERSION: ${{ vars.BUTLER_VERSION }}
      BUTLER_SHA256_LINUX_AMD64: ${{ vars.BUTLER_SHA256_LINUX_AMD64 }}
    steps:
      - name: Validate request and configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must have the form vX.Y.Z" >&2; exit 1; }
          [[ "$ITCH_TARGET" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "ITCH_TARGET must have the form user/project" >&2; exit 1; }
          [[ "$BUTLER_VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "BUTLER_VERSION is not configured" >&2; exit 1; }
          [[ "$BUTLER_SHA256_LINUX_AMD64" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "BUTLER_SHA256_LINUX_AMD64 must be a SHA-256 digest" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download published GitHub Release builds
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false || { echo "GitHub Release $RELEASE_TAG is still a draft" >&2; exit 1; }
          mkdir -p downloads
          for flavor in normal halloween; do
            if [[ "$RELEASE_FLAVORS" != both && "$RELEASE_FLAVORS" != "$flavor" ]]; then continue; fi
            suffix=""
            if [[ "$flavor" == halloween ]]; then suffix="-halloween"; fi
            for platform in linux-x86_64 windows-x86_64 html5; do
              case "$platform" in linux-x86_64) extension=tar.gz ;; *) extension=zip ;; esac
              archive="the-specimen-bevy-${RELEASE_TAG}-${platform}${suffix}.${extension}"
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "downloads/$flavor/$platform"
              test -f "downloads/$flavor/$platform/$archive"
            done
          done
          find downloads -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > release-sha256.txt
      - name: Prepare and verify Butler payloads
        shell: bash
        run: |
          set -euo pipefail
          for flavor in normal halloween; do
            if [[ "$RELEASE_FLAVORS" != both && "$RELEASE_FLAVORS" != "$flavor" ]]; then continue; fi
            suffix=""
            if [[ "$flavor" == halloween ]]; then suffix="-halloween"; fi
            root="itch-upload/$flavor"
            mkdir -p "$root/linux" "$root/windows" "$root/html5"
            tar -xzf "downloads/$flavor/linux-x86_64/the-specimen-bevy-${RELEASE_TAG}-linux-x86_64${suffix}.tar.gz" -C "$root/linux"
            unzip -q "downloads/$flavor/windows-x86_64/the-specimen-bevy-${RELEASE_TAG}-windows-x86_64${suffix}.zip" -d "$root/windows"
            unzip -q "downloads/$flavor/html5/the-specimen-bevy-${RELEASE_TAG}-html5${suffix}.zip" -d "$root/html5"
            test -x "$root/linux/the-specimen-bevy"
            test -f "$root/linux/LICENSE"
            test -d "$root/linux/assets"
            test -d "$root/linux/credits"
            test -f "$root/windows/the-specimen-bevy.exe"
            test -f "$root/windows/LICENSE"
            test -d "$root/windows/assets"
            test -d "$root/windows/credits"
            test -f "$root/html5/index.html"
            test -d "$root/html5/assets"
            find "$root/html5" -maxdepth 1 -type f -name '*_bg.wasm' -print -quit | grep -q .
          done
          (cd itch-upload && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../upload-sha256.txt)
      - name: Install pinned Butler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/butler.zip"
          install_dir="$RUNNER_TEMP/butler"
          curl --fail --location --silent --show-error \
            "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default" \
            --output "$archive"
          printf '%s  %s\n' "$BUTLER_SHA256_LINUX_AMD64" "$archive" | sha256sum --check
          mkdir "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/butler"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/butler" -V
      - name: Upload HTML5, Windows, and Linux channels
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo "BUTLER_API_KEY is not configured" >&2; exit 1; }
          for flavor in normal halloween; do
            if [[ "$RELEASE_FLAVORS" != both && "$RELEASE_FLAVORS" != "$flavor" ]]; then continue; fi
            suffix=""
            if [[ "$flavor" == halloween ]]; then suffix="-halloween"; fi
            for platform in html5 windows linux; do
              butler push "itch-upload/$flavor/$platform" "${ITCH_TARGET}:$platform$suffix" --userversion "${RELEASE_TAG#v}$suffix"
            done
          done
      - name: Store deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itch-deployment-${{ inputs.tag }}
          path: |
            release-sha256.txt
            upload-sha256.txt
          if-no-files-found: warn

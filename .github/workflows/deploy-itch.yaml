name: deploy-itch
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: itch-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: itch-production
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      BUTLER_VERSION: ${{ vars.BUTLER_VERSION }}
      BUTLER_SHA256_LINUX_AMD64: ${{ vars.BUTLER_SHA256_LINUX_AMD64 }}
    steps:
      - name: Validate request and configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must have the form vX.Y.Z" >&2; exit 1; }
          [[ "$ITCH_TARGET" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "ITCH_TARGET must have the form user/project" >&2; exit 1; }
          [[ "$BUTLER_VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "BUTLER_VERSION is not configured" >&2; exit 1; }
          [[ "$BUTLER_SHA256_LINUX_AMD64" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "BUTLER_SHA256_LINUX_AMD64 must be a SHA-256 digest" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download published GitHub Release builds
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false || { echo "GitHub Release $RELEASE_TAG is still a draft" >&2; exit 1; }
          mkdir -p downloads
          for platform in linux-x86_64 windows-x86_64 html5; do
            name="the-specimen-bevy-${platform}"
            case "$platform" in linux-x86_64) extension=tar.gz ;; *) extension=zip ;; esac
            archive="the-specimen-bevy-${RELEASE_TAG}-${platform}.${extension}"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "downloads/$name"
          done
          test -f "downloads/the-specimen-bevy-linux-x86_64/the-specimen-bevy-${RELEASE_TAG}-linux-x86_64.tar.gz"
          test -f "downloads/the-specimen-bevy-windows-x86_64/the-specimen-bevy-${RELEASE_TAG}-windows-x86_64.zip"
          test -f "downloads/the-specimen-bevy-html5/the-specimen-bevy-${RELEASE_TAG}-html5.zip"
          find downloads -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > release-sha256.txt
      - name: Prepare and verify Butler payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p itch-upload/linux itch-upload/windows itch-upload/html5
          tar -xzf "downloads/the-specimen-bevy-linux-x86_64/the-specimen-bevy-${RELEASE_TAG}-linux-x86_64.tar.gz" -C itch-upload/linux
          unzip -q "downloads/the-specimen-bevy-windows-x86_64/the-specimen-bevy-${RELEASE_TAG}-windows-x86_64.zip" -d itch-upload/windows
          unzip -q "downloads/the-specimen-bevy-html5/the-specimen-bevy-${RELEASE_TAG}-html5.zip" -d itch-upload/html5
          test -x itch-upload/linux/the-specimen-bevy
          test -f itch-upload/linux/LICENSE
          test -d itch-upload/linux/assets
          test -d itch-upload/linux/credits
          test -f itch-upload/windows/the-specimen-bevy.exe
          test -f itch-upload/windows/LICENSE
          test -d itch-upload/windows/assets
          test -d itch-upload/windows/credits
          test -f itch-upload/html5/index.html
          test -d itch-upload/html5/assets
          find itch-upload/html5 -maxdepth 1 -type f -name '*_bg.wasm' -print -quit | grep -q .
          (cd itch-upload && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../upload-sha256.txt)
      - name: Install pinned Butler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/butler.zip"
          install_dir="$RUNNER_TEMP/butler"
          curl --fail --location --silent --show-error \
            "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default" \
            --output "$archive"
          printf '%s  %s\n' "$BUTLER_SHA256_LINUX_AMD64" "$archive" | sha256sum --check
          mkdir "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/butler"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/butler" -V
      - name: Upload HTML5, Windows, and Linux channels
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo "BUTLER_API_KEY is not configured" >&2; exit 1; }
          for platform in html5 windows linux; do
            butler push "itch-upload/$platform" "${ITCH_TARGET}:$platform" --userversion "${RELEASE_TAG#v}"
          done
      - name: Store deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itch-deployment-${{ inputs.tag }}
          path: |
            release-sha256.txt
            upload-sha256.txt
          if-no-files-found: warn

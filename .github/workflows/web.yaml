name: Web build
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build web launcher
        run: nix develop --command trunk build --release
